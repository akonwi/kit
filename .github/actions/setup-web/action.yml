name: Set up the browser client
description: >-
  Installs a pinned Bun and the locked dependencies of the browser client in
  apps/web. Bun is used only to build and check the client (ADR 0059).

inputs:
  bun-version:
    description: Bun release. Bump it here to move every workflow together.
    default: "1.3.14"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install browser client dependencies
      shell: bash
      working-directory: apps/web
      run: bun install --frozen-lockfile
