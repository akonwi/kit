name: Unit tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test compatibility gate
        run: scripts/test-openapi-compatibility.sh

      - name: Check compatibility with the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          go install github.com/oasdiff/oasdiff@v1.33.0
          OASDIFF_BIN="$(go env GOPATH)/bin/oasdiff" scripts/check-openapi-compatibility.sh "$release_tag"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      # Native Tree-sitter and the race detector require a C toolchain.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Isolate Kit test state
        shell: bash
        run: echo "KIT_HOME=$(mktemp -d "$RUNNER_TEMP/kit-test-home.XXXXXX")" >> "$GITHUB_ENV"

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test daemon and supporting packages
        run: go test -count=1 ./...

      - name: Test for data races
        run: go test -race -count=1 ./...

  ard-client:
    name: Ard client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            apps/cli/go.sum

      - uses: ./.github/actions/setup-ard

      - name: Isolate Kit test state
        run: echo "KIT_HOME=$(mktemp -d "$RUNNER_TEMP/kit-test-home.XXXXXX")" >> "$GITHUB_ENV"

      - name: Check Ard formatting
        run: ard format --check .

      - name: Type-check
        run: ard check main.ard

      - name: Test Ard
        run: ard test

      - name: Vet Go bridges
        run: go vet ./...

      - name: Test Go bridges
        run: go test -count=1 ./...

      - name: Build
        run: ard build main.ard --out "$RUNNER_TEMP/kit-ard/kit"
