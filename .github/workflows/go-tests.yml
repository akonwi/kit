name: Unit tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test compatibility gate
        run: scripts/test-openapi-compatibility.sh

      - name: Check compatibility with the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          go install github.com/oasdiff/oasdiff@v1.33.0
          OASDIFF_BIN="$(go env GOPATH)/bin/oasdiff" scripts/check-openapi-compatibility.sh "$release_tag"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      # Native Tree-sitter and the race detector require a C toolchain.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Isolate Kit test state
        shell: bash
        run: echo "KIT_HOME=$(mktemp -d "$RUNNER_TEMP/kit-test-home.XXXXXX")" >> "$GITHUB_ENV"

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test TUI, daemon, and supporting packages
        run: go test -count=1 ./...

      - name: Test for data races
        run: go test -race -count=1 ./...

      - name: Test terminal input ownership
        run: python3 scripts/test-tui-input-ownership.py

  ard-client:
    name: Ard client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: apps/cli
    env:
      ARD_VERSION: v0.44.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            apps/cli/go.sum

      - name: Install Ard
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="ard_${ARD_VERSION}_${os}_${arch}.tar.gz"
          release="https://github.com/akonwi/ard/releases/download/${ARD_VERSION}"
          install_dir="$RUNNER_TEMP/ard"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 -o "$install_dir/$archive" "$release/$archive"
          curl -fsSL --retry 3 -o "$install_dir/checksums.txt" "$release/checksums.txt"
          expected=$(awk -v name="$archive" '{ file = $2; sub(/^.*\//, "", file); if (file == name) print $1 }' "$install_dir/checksums.txt")
          actual=$(shasum -a 256 "$install_dir/$archive" | awk '{ print $1 }')
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "Checksum mismatch for $archive: expected '$expected', got '$actual'"
            exit 1
          fi
          tar -xzf "$install_dir/$archive" -C "$install_dir" ard
          echo "$install_dir" >> "$GITHUB_PATH"
          echo "ARD_CACHE_DIR=$RUNNER_TEMP/ard-cache" >> "$GITHUB_ENV"
          echo "KIT_HOME=$(mktemp -d "$RUNNER_TEMP/kit-test-home.XXXXXX")" >> "$GITHUB_ENV"

      - name: Fetch Ard dependencies
        run: |
          ard version
          ard deps fetch
          ard deps verify

      - name: Check Ard formatting
        run: ard format --check .

      - name: Type-check
        run: ard check main.ard

      - name: Test Ard
        run: ard test

      - name: Vet Go bridges
        run: go vet ./...

      - name: Test Go bridges
        run: go test -count=1 ./...

      - name: Build
        run: ard build main.ard --out "$RUNNER_TEMP/kit-ard/kit"
