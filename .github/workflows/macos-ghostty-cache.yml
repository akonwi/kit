name: macOS libghostty cache
# Pull requests read caches saved on their base branch, and no other
# workflow runs on main. This one builds the pinned libghostty on main, so
# a new pull request's macOS jobs restore it instead of each building it.
on:
  push:
    branches: [main]
    paths: ['apps/macos/script/build_ghosttykit.sh', 'apps/macos/ThirdParty/Ghostty/**', '.github/actions/setup-ghostty/**', '.github/workflows/macos-ghostty-cache.yml']
  workflow_dispatch:
jobs:
  libghostty:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ghostty
