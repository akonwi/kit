name: macOS
on:
  pull_request:
    paths: ['apps/macos/**', 'api/kit-session.openapi.json', 'internal/protocol/**', 'internal/version/**', 'assets/kit/**', '.github/workflows/macos.yml']
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify generated protocol
        run: |
          python3 apps/macos/script/generate_wire.py --check
          apps/macos/script/generate_openapi.sh --check
      - name: Build clean app without private fixtures
        run: apps/macos/script/build_and_run.sh --build
      - name: Test
        working-directory: apps/macos
        run: xcodebuild -scheme Kit -destination 'platform=macOS' -derivedDataPath .build/xcode -skipPackagePluginValidation test
      - name: Validate app packaging scripts
        run: bash -n apps/macos/script/build_and_run.sh apps/macos/script/package_app.sh
      - name: Build Apple Silicon Release staging app (not distributable)
        env:
          KIT_MACOS_APP_BUNDLE: ${{ runner.temp }}/Kit-release-check.app
          KIT_MACOS_CONFIGURATION: Release
          KIT_MACOS_ARCH: arm64
          KIT_MACOS_RELEASE_BUILD: '1'
          KIT_MACOS_APP_VERSION: 0.1.3
          KIT_MACOS_CLIENT_RELEASE: 0.39.0
          KIT_MACOS_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          KIT_MACOS_APP_BUILD="$(git rev-list --count HEAD)" apps/macos/script/build_and_run.sh --build
          test "$(lipo -archs "$KIT_MACOS_APP_BUNDLE/Contents/MacOS/Kit")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :KitSourceCommit' "$KIT_MACOS_APP_BUNDLE/Contents/Info.plist")" = "$GITHUB_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$KIT_MACOS_APP_BUNDLE/Contents/Info.plist")" = 0.1.3
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KIT_MACOS_APP_BUNDLE/Contents/Info.plist")" = "$(git rev-list --count HEAD)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :KitClientRelease' "$KIT_MACOS_APP_BUNDLE/Contents/Info.plist")" = 0.39.0
          test ! -e "$KIT_MACOS_APP_BUNDLE/Contents/Resources/fixture.json"
          test ! -e "$KIT_MACOS_APP_BUNDLE/Contents/Resources/workspace.json"
