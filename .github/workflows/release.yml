name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      # Tree-sitter and its curated grammars are compiled into the executable.
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin_arm64
          # macos-13 (Intel) runners are retired; macos-15-intel is the
          # supported Intel label through 2027.
          - os: macos-15-intel
            platform: darwin_amd64
          - os: ubuntu-24.04-arm
            platform: linux_arm64
          - os: ubuntu-24.04
            platform: linux_amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag of the form vX.Y.Z" >&2
            exit 1
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/akonwi/kit/internal/version.Version=${GITHUB_REF_NAME#v} -X github.com/akonwi/kit/internal/version.Commit=$GITHUB_SHA" -o dist/kit ./cmd/kit

      - name: Smoke test packaged executable
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "kit_${GITHUB_REF_NAME}_${{ matrix.platform }}.tar.gz" -C dist kit
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "kit_${GITHUB_REF_NAME}_${{ matrix.platform }}.tar.gz" -C "$smoke_dir"
          export KIT_HOME="$smoke_dir/home"
          actual=$("$smoke_dir/kit" version)
          expected="kit ${GITHUB_REF_NAME#v} ($GITHUB_SHA)"
          [[ "$actual" == "$expected" ]] || { printf 'Expected %s; got %s\n' "$expected" "$actual" >&2; exit 1; }
          "$smoke_dir/kit" --help

      - uses: actions/upload-artifact@v4
        with:
          name: kit-${{ matrix.platform }}
          path: kit_*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*.tar.gz
